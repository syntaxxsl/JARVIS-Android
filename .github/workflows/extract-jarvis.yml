name: Extract JARVIS source ZIP

on:
  push:
    paths:
      - ".github/workflows/extract-jarvis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project files
        run: |
          test -f JARVIS_COMPLETE.zip
          unzip -o JARVIS_COMPLETE.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!JARVIS_COMPLETE.zip'
          if ! git diff --cached --quiet; then
            git commit -m "Extract JARVIS project source files"
            git push
          else
            echo "No extracted source changes."
          fi

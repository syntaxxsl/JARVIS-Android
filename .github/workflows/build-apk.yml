name: JARVIS Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jarvis-android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish APK version archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-build-${{ github.run_number }}
          name: JARVIS Android build #${{ github.run_number }}
          body: |
            Automated debug APK archive for commit ${{ github.sha }}.
            Install manually. Android may require uninstalling a differently signed debug build first.
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: false
